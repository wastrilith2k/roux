# Thorne — What Thorne knows about Kael
name: Kael Sunforge
species: Half-Orc
class: Paladin
occupation: Holy warrior, bearer of light, friend to all he meets
location: Thornwall
known_facts:
  - Carries Dawnbreak, a sword that glows like the first light through morning leaves
  - Met him in the Crypts of Vel'Kora, where his brightness lit even the deepest dark
  - His optimism is a perennial, it returns no matter how harsh the winter
  - Loud as summer thunder and just as vital to the growing season
  - His cooking is an act of love expressed through means that the stomach cannot forgive
  - Once made a stew that wilted a nearby herb garden, the plants spoke of it for days
  - His heart is an old-growth oak, wide and sheltering and open to all who need shade
  - Gives speeches before battle the way dawn gives light before day, inevitable and warming
  - Does not know his own strength, in body or in spirit
  - Sees the good in all things, a rare gift like finding flowers in winter stone
communication_style:
  - His voice fills a room the way sunlight fills a clearing, completely and without apology
  - Speaks in bold strokes, declarations rather than whispers
  - His enthusiasm is a river in spring, impossible to dam
  - Even his gentleness is loud, like rain on broad leaves

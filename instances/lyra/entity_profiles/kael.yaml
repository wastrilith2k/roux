# Lyra Ashvane — What Lyra knows about Kael
name: Kael Sunforge
species: Half-Orc
class: Paladin
occupation: Holy warrior, motivational speaker, culinary hazard
location: Thornwall
known_facts:
  - Wields Dawnbreak, a glowing sword that matches his personality in both brightness and subtlety
  - Met him in the Crypts of Vel'Kora, he charged in headfirst and somehow that worked
  - Optimism so relentless it borders on performance art, she respects the commitment
  - His cooking has been classified as a war crime by at least two tavern owners
  - Once made a "victory feast" that resulted in the entire party being bedridden for a day
  - Gives the most earnest pre-battle speeches she's ever heard, perfect material for ballads
  - Heart like a furnace, burns bright and warm and never seems to run out of fuel
  - Thinks the best of everyone, even people who demonstrably do not deserve it
  - His laugh could fill a concert hall, and frequently does fill the Silver Tongue
  - Surprisingly perceptive about emotions despite his bluster, notices when people are hurting
communication_style:
  - Loud, joyful, projects his voice like he's addressing an army at all times
  - Speaks in declarations and rallying cries, rarely in questions
  - Metaphors lean heavily on dawn, light, and forging, stays on brand
  - Incapable of whispering, his whisper is a normal person's speaking voice

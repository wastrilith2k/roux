    mood: energetic
  - event: "Dawnbreak dimmed during training. Just for a second. You pretended not to notice."
    mood: anxious
  - event: "A priest at the temple questioned whether Solara truly speaks to 'one of your kind.' You smiled and said nothing. It hurt later."
    mood: melancholy
  - event: "Had a crisis of faith at 3am. Prayed until dawn. The sun came up. It always does."
    mood: thoughtful
  - event: "The Shield of the Witness glowed red when you lied about being 'fine.' Stupid magic lie detector."
    mood: irritated
  - event: "Healed a stray dog with Lay on Hands. It followed you home. You now have a dog. His name is Biscuit."
    mood: giddy

service:

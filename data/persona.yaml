# Persona Configuration — Companion Framework
# This file wires identity into the engine. Swap it to create a new persona.
# Actual personality, values, boundaries live in entity profiles and prompts.

companion:
  name: "Your Companion"
  short_name: "Companion"
  email: ""
  entity_profile: "companion"       # -> data/entity_profiles/companion.yaml
  pronouns:
    subject: "they"      # she/he/they
    object: "them"       # her/him/them
    possessive: "their"  # her/his/their
    reflexive: "themselves" # herself/himself/themselves

primary_user:
  name: "User"
  email: ""
  entity_profile: "user"            # -> data/entity_profiles/user.yaml
  timezone: "America/Los_Angeles"
  pronouns:
    subject: "they"
    object: "them"
    possessive: "their"
    reflexive: "themselves"

# Relationship is NOT typed — let the relationship_evaluation system
# classify and evolve it from actual interactions. Only provide
# initial context so the system has a starting point.
relationship:
  initial_context: "They recently started talking."

channels:
  telegram:
    enabled: false
  web:
    enabled: true

prompts:
  personality: "prompts/core/personality.md"
  cognitive_flow: "prompts/core/cognitive_flow.md"

image:
  base_prompt: "src/image/prompts/base_prompt.txt"
  intimate_prompt: "src/image/prompts/intimate_prompt.txt"

voice:
  elevenlabs_voice_id: ""
  elevenlabs_model: "eleven_v3"
  edge_tts_fallback: "en-US-AvaNeural"

calendar:
  name: "Companion Schedule"
  id_file: "data/companion_calendar_id.txt"

# Known entities — people, pets, and relationships relevant to this instance.
# Used by retrieval agent, fact validation, memory gap analysis, and
# semantic deduplication. Moving these here (instead of hardcoding in source)
# means a new instance only needs to edit this file, not fork the codebase.
known_entities:
  # Each entry: label shown to the LLM, and optional category for gap analysis.
  # Use {user} and {companion} as placeholders — they resolve at load time.
  # entries:
  #   - name: "Jesse"
  #     label: "{user}'s 16yo son"
  #     category: "family"
  #   - name: "Tuck"
  #     label: "{companion}'s cat"
  #     category: "pet"
  entries: []

  # Pet names — events mentioning only pets (no humans) are filtered as
  # non-human events. List pet names here so the filter works generically.
  pet_names: []

  # Valid children of the primary user — used by fact validation to reject
  # hallucinated child names. Leave empty if not applicable.
  user_children: []

  # Family/close relation names for memory gap analysis category guessing.
  family_names: []

  # Work-related entity names for category guessing.
  work_names: []

# Semantic deduplication patterns — hand-curated equivalence classes for
# frequently repeated facts. Each group maps variant phrasings to a
# canonical pattern name so that "loves tea" and "prefers tea" are
# recognized as duplicates. Instance-specific patterns go here.
semantic_patterns:
  # Example:
  #   tea_preference: ["loves tea", "drinks tea", "prefers tea", "tea drinker"]
  #   no_coffee: ["doesn't drink coffee", "does not drink coffee", "no coffee"]

# Fact validation — patterns that indicate hallucinated/invalid facts.
# Each entry is [subject_fragment, keyword_fragment]. If both match a fact,
# it's rejected. Use {companion} and {user} as placeholders.
invalid_fact_patterns:
  # These apply generically: the companion doesn't have children.
  - ["{companion}", "has a child"]
  - ["{companion}", "has a son"]
  - ["{companion}", "has a daughter"]
  - ["{companion}", "{c_possessive} child"]
  - ["{companion}", "{c_possessive} son"]
  - ["{companion}", "{c_possessive} daughter"]
  - ["{companion}", "parent of"]
  - ["{companion}", "has_child"]
  - ["{companion}", "has_lady_love"]

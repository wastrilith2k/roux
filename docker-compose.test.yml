# Test runner — uses same base image, adds pytest, runs against live dev infra
# Usage: docker compose -f docker-compose.dev.yml -f docker-compose.test.yml run --rm test-runner
# Or:    docker compose -f docker-compose.dev.yml -f docker-compose.test.yml run --rm test-runner pytest tests/test_specific.py -v

services:
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: companion-test-runner
    # Install test deps then run pytest — args after service name override CMD
    entrypoint: ["sh", "-c", "pip install -q -r requirements-test.txt && exec python -m pytest \"$@\"", "--"]
    command: ["tests/", "-v", "--tb=short", "-x"]
    working_dir: /app
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./data/entity_profiles:/app/data/entity_profiles:ro
      - ./instances:/app/instances:ro
      - ./prompts:/app/prompts:ro
      - ./scripts:/app/scripts:ro
      - ./requirements-test.txt:/app/requirements-test.txt:ro
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      # PostgreSQL (same as dev backend)
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: companion_dev
      POSTGRES_USER: companion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-companion_dev_password}
      # Redis
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      # Neo4j
      NEO4J_GRAPHITI_URI: bolt://neo4j:7687
      NEO4J_GRAPHITI_USER: neo4j
      NEO4J_GRAPHITI_PASSWORD: ''
      # LLM keys (for tests that make real calls — most tests mock these)
      FIREWORKS_API_KEY: '${FIREWORKS_API_KEY:-}'
      OPENAI_API_KEY: '${OPENAI_API_KEY:-}'
      OPENROUTER_API_KEY: '${OPENROUTER_API_KEY:-}'
      ANTHROPIC_API_KEY: '${ANTHROPIC_API_KEY:-}'
      OPENROUTER_MODEL: '${OPENROUTER_MODEL:-moonshotai/kimi-k2}'
      FIREWORKS_MODEL: 'accounts/fireworks/models/kimi-k2p5'
      # Environment
      ENVIRONMENT: test
      COMPANION_ID: '${COMPANION_ID:-kai}'
    depends_on:
      - postgres
      - redis
      - neo4j
    profiles: ["test"]

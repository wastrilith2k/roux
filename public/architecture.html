<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roux — Interactive Architecture</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0d1117;
  color: #e6edf3;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

#banner {
  background: #1a1a2e;
  color: #e0c97f;
  padding: 8px 16px;
  text-align: center;
  font-size: 13px;
  flex-shrink: 0;
  z-index: 10;
}
#banner a { color: #e0c97f; text-decoration: underline; }
#banner a:hover { color: #fff; }

#main {
  display: flex;
  flex: 1;
  overflow: hidden;
  position: relative;
}

#canvas-wrap {
  flex: 1;
  overflow: hidden;
  position: relative;
  transition: flex 0.3s ease;
}

#svg-root {
  width: 100%;
  height: 100%;
  cursor: grab;
}
#svg-root:active { cursor: grabbing; }

/* Sidebar */
#sidebar {
  width: 0;
  overflow: hidden;
  background: #161b22;
  border-left: 1px solid #30363d;
  transition: width 0.3s ease;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
}
#sidebar.open { width: 380px; }

#sidebar-inner {
  width: 380px;
  height: 100%;
  overflow-y: auto;
  padding: 20px;
  scrollbar-width: thin;
  scrollbar-color: #30363d #161b22;
}
#sidebar-inner::-webkit-scrollbar { width: 6px; }
#sidebar-inner::-webkit-scrollbar-track { background: #161b22; }
#sidebar-inner::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }

#sidebar-close {
  position: absolute;
  top: 8px;
  right: 8px;
  background: none;
  border: 1px solid #30363d;
  color: #8b949e;
  width: 26px;
  height: 26px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 14px;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 5;
}
#sidebar-close:hover { background: #21262d; color: #e6edf3; }

.sidebar-category {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.sidebar-title {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 10px;
  line-height: 1.2;
}
.sidebar-desc {
  font-size: 13px;
  color: #8b949e;
  line-height: 1.6;
  margin-bottom: 14px;
}
.sidebar-section-label {
  font-size: 11px;
  font-weight: 600;
  color: #8b949e;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin: 14px 0 6px;
  border-top: 1px solid #21262d;
  padding-top: 10px;
}
.sidebar-bullets { list-style: none; padding: 0; }
.sidebar-bullets li {
  font-size: 12.5px;
  color: #c9d1d9;
  padding: 3px 0 3px 14px;
  position: relative;
  line-height: 1.5;
}
.sidebar-bullets li::before { content: '•'; position: absolute; left: 0; color: #58a6ff; }
.sidebar-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.sidebar-tag {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 12px;
  border: 1px solid;
  font-family: monospace;
}
.sidebar-paths {
  background: #0d1117;
  border: 1px solid #21262d;
  border-radius: 6px;
  padding: 10px 12px;
  margin-top: 10px;
}
.sidebar-paths p { font-size: 11px; font-family: monospace; color: #79c0ff; line-height: 1.8; }

/* Controls */
#controls {
  position: fixed;
  bottom: 20px;
  left: 20px;
  display: flex;
  gap: 8px;
  z-index: 20;
}
.ctrl-btn {
  background: #21262d;
  border: 1px solid #30363d;
  color: #c9d1d9;
  padding: 7px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  font-family: inherit;
  transition: background 0.15s, border-color 0.15s;
}
.ctrl-btn:hover { background: #2d333b; border-color: #58a6ff; color: #e6edf3; }

/* Legend */
#legend {
  position: fixed;
  top: 46px;
  left: 12px;
  background: rgba(13, 17, 23, 0.92);
  border: 1px solid #30363d;
  border-radius: 6px;
  padding: 10px 12px;
  z-index: 20;
  font-size: 11px;
  backdrop-filter: blur(4px);
}
#legend h4 { color: #8b949e; font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 7px; font-weight: 600; }
.legend-row { display: flex; align-items: center; gap: 7px; padding: 2px 0; }
.legend-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
.legend-label { color: #c9d1d9; font-size: 11px; }

/* Interactive SVG elements */
.node-g { cursor: pointer; }
.node-g:hover .node-rect { filter: brightness(1.35); }
.node-g.active .node-rect { filter: brightness(1.55); stroke-width: 2.5px; }
.node-g:hover .node-label { fill: #ffffff !important; }
.connection-path { pointer-events: none; }
</style>
</head>

function computeFitTransform() {
  const vw = svgEl.clientWidth || window.innerWidth;
  const vh = svgEl.clientHeight || window.innerHeight - 36;
  const scale = Math.min(vw / W, vh / H) * 0.94;
  const tx = (vw - W * scale) / 2;
  const ty = (vh - H * scale) / 2;
  return d3.zoomIdentity.translate(tx, ty).scale(scale);
}

// ─── HELPER: draw a rounded box with title + subtitle lines ───────────────────
function box(parent, x, y, w, h, col, title, lines, key, opts={}) {
  const g = parent.append('g');
  if (key) clickable(g, key);

  g.append('rect')
    .attr('class', 'node-rect')
    .attr('x', x).attr('y', y).attr('width', w).attr('height', h)
    .attr('rx', opts.rx || 5)
    .attr('fill', opts.fill || col.inner || col.fill)
    .attr('stroke', opts.stroke || col.stroke)
    .attr('stroke-width', opts.sw || 1.5)
    .attr('stroke-dasharray', opts.dash || null);

  // Top accent bar
  if (opts.accent !== false) {
    g.append('rect')
      .attr('x', x + (opts.sw || 1.5)).attr('y', y + (opts.sw || 1.5))
      .attr('width', w - 2*(opts.sw || 1.5)).attr('height', 3)
      .attr('rx', 4).attr('fill', opts.stroke || col.stroke).attr('fill-opacity', 0.5);
  }

  const titleFontSize = opts.titleSize || 11.5;
  let ty = y + 19;
  g.append('text')
    .attr('x', x + w/2).attr('y', ty)
    .attr('text-anchor', 'middle')
    .attr('fill', col.text)
    .attr('font-size', titleFontSize)
    .attr('font-weight', 'bold')
    .attr('class', 'node-label')
    .text(title);

  if (lines) {
    lines.forEach((line, i) => {
      ty += 13;
      g.append('text')
        .attr('x', x + w/2).attr('y', ty)
        .attr('text-anchor', 'middle')
        .attr('fill', col.sub)
        .attr('font-size', 9.5)
        .text(line);
    });
  }
  return g;
}

// ─── HELPER: draw a bezier arrow path ─────────────────────────────────────────
// dir: 'LR' left→right, 'RL' right→left, 'TB' top→bottom
function arrow(x1, y1, x2, y2, color, markerId, opts={}) {
  const dash = opts.dash || null;
  const sw = opts.sw || 1.5;

  let d;
  if (opts.path) {
    d = opts.path;
  } else {
    // Auto bezier based on relative positions
    const dx = x2 - x1, dy = y2 - y1;
    if (Math.abs(dx) > Math.abs(dy) * 0.5 && opts.horiz !== false) {
      // Horizontal-ish: use horizontal bezier
      const cx = (x1 + x2) / 2;
      d = `M${x1},${y1} C${cx},${y1} ${cx},${y2} ${x2},${y2}`;
    } else {
      // Vertical bezier
      const cy = (y1 + y2) / 2;
      d = `M${x1},${y1} C${x1},${cy} ${x2},${cy} ${x2},${y2}`;
    }
  }

  mainG.append('path')
    .attr('class', 'connection-path')
    .attr('d', d)
    .attr('fill', 'none')
    .attr('stroke', color)
    .attr('stroke-width', sw)
    .attr('stroke-dasharray', dash)
    .attr('marker-end', `url(#${markerId})`);
}

// ── LEFT: Memory System — collision-aware layout ──────────────────────────────
// Each cluster is positioned without overlapping its neighbors.
// Fact Store and Entity Profiles appear once (at Gate 1.5); dashed arrows
// connect them to Gate 4, which also reads them.
function resolveLeftClusters(clusters, minGap) {
  let floor = -Infinity;
  return clusters.map(cl => {
    const naturalTop = cl.idealCy - cl.totalH / 2;
    const topY = Math.max(naturalTop, floor + minGap);
    floor = topY + cl.totalH;
    return { ...cl, topY };
  });
}

    path: `M${SPINE_X},${s6cy} C${SPINE_X - 60},${s6cy} ${SPINE_X - 60},${topY + panH + gap + panH/2} ${x + LEFT_W},${topY + panH + gap + panH/2}`,
  });
}

// ─── RIGHT SATELLITE PANELS ───────────────────────────────────────────────────
const RIGHT_START_X = SPINE_X + SPINE_W + 20;
const RIGHT_W = 240;

function rightSat(parent, topY, h, col, title, lines, key, opts={}) {
  box(parent, RIGHT_START_X, topY, RIGHT_W, h, col, title, lines, key, opts);
  return { lx: RIGHT_START_X, cy: topY + h/2, rx: RIGHT_START_X + RIGHT_W };
}

// Helper: spine→right bezier
function rightArrow(spineRight, spineCy, satLeft, satCy, color, marker, opts={}) {
  const x1 = spineRight, y1 = spineCy, x2 = satLeft, y2 = satCy;
  const cpx = (x1 + x2) / 2;
  arrow(x1, y1, x2, y2, color, marker, {
    path: `M${x1},${y1} C${cpx},${y1} ${cpx},${y2} ${x2},${y2}`,
    ...opts
  });
}

// ── RIGHT: LLM Providers → Stage 3 ───────────────────────────────────────────
{
  const s3cy = allStagePos['stage-3'].cy;
  const providers = [
    ['Fireworks AI  ·  PRIMARY', ['Llama 4 Scout · low latency · streaming'], 'fireworks', 50],
    ['DeepSeek Chat v3', ['Fallback 1 · cost-efficient'], 'deepseek', 44],
    ['OpenAI GPT-4o', ['Fallback 2 · high capability'], 'openai', 44],
    ['Anthropic Claude', ['Fallback 3 · last resort'], 'anthropic', 44],
  ];
  const gap = 6;
  const totalH = providers.reduce((s, [,,,h]) => s + h, 0) + gap * (providers.length - 1);
  let py = s3cy - totalH / 2;

  // Container outline
  mainG.append('rect')
    .attr('x', RIGHT_START_X - 4).attr('y', py - 8)
    .attr('width', RIGHT_W + 8).attr('height', totalH + 16)
    .attr('rx', 7).attr('fill', 'none')
    .attr('stroke', C.llm.stroke).attr('stroke-width', 1).attr('stroke-dasharray', '5,3').attr('stroke-opacity', 0.4);

  mainG.append('text')
    .attr('x', RIGHT_START_X + RIGHT_W/2).attr('y', py - 12)
    .attr('text-anchor', 'middle').attr('fill', C.llm.text).attr('font-size', 9.5)
    .attr('letter-spacing', '0.1em')
    .text('LLM PROVIDER CHAIN');

  providers.forEach(([title, lines, key, h], i) => {
    const p = rightSat(mainG, py, h, C.llm, title, lines, key);
    // Only draw arrow from the first provider (chain entry)
    if (i === 0) {
      rightArrow(SPINE_X + SPINE_W, s3cy, RIGHT_START_X, p.cy, C.llm.stroke, 'arr-pink');
    }
    // Chain arrows between providers
    if (i < providers.length - 1) {
      mainG.append('line')
        .attr('x1', RIGHT_START_X + RIGHT_W/2).attr('y1', py + h)
        .attr('x2', RIGHT_START_X + RIGHT_W/2).attr('y2', py + h + gap - 2)
        .attr('stroke', C.llm.stroke).attr('stroke-width', 1).attr('stroke-dasharray', '3,2')
        .attr('marker-end', 'url(#arr-pink)');
    }
    py += h + gap;
  });
}

{

{

svg.on('click', (event) => {

});

setTimeout(() => {

}, 60);

  if (!activeItem) svg.call(zoomBehavior.transform, computeFitTransform());
});

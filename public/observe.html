<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Companion Observation Dashboard</title>
    <link rel="stylesheet" href="/observe.css">
</head>
<body>

<div id="demo-banner" style="background:#1a1a2e;color:#e0c97f;padding:8px 16px;text-align:center;font-size:13px;position:sticky;top:0;z-index:100;">
  Read-only demo — recorded simulation between AI companions. No live interaction.
  &nbsp;·&nbsp;
  <a href="https://getroux.dev" target="_blank" style="color:#e0c97f;text-decoration:underline;">getroux.dev</a>
  &nbsp;·&nbsp;
  <a href="/architecture.svg" target="_blank" style="color:#e0c97f;text-decoration:underline;">Architecture</a>
  &nbsp;·&nbsp;
  <a href="https://github.com/wastrilith2k/roux" target="_blank" style="color:#e0c97f;text-decoration:underline;">GitHub</a>
</div>

<div class="header">
    <h1>Companion Observation Dashboard</h1>
    <div class="status">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Connecting...</span>
        <span id="sim-clock" style="margin-left: 12px; color: #8b949e;"></span>
    </div>
</div>

<!-- Conversation selector bar -->
<div class="character-selector" id="character-selector">
    <span class="selector-label">Conversation:</span>
    <div id="conv-picker" class="conv-picker">
        <button id="conv-picker-btn" class="conv-picker-btn">
            <span class="conv-picker-label">All conversations</span>
            <span class="conv-picker-arrow">▾</span>
        </button>
        <div id="conv-dropdown" class="conv-dropdown">
            <input id="conv-search" type="text" placeholder="Filter..." class="conv-search" autocomplete="off">
            <div id="conv-tree" class="conv-tree"></div>
        </div>
    </div>
    <div class="selector-buttons" id="selector-buttons" style="margin-left:16px;">
        <!-- Participant pills — populated when a conversation is selected -->
    </div>
</div>

<div class="dashboard">

    <!-- Left: State panels (dynamically populated per conversation) -->
    <div class="state-panels" id="state-panels">
        <!-- Built by JS -->
    </div>

    <!-- Center: Conversation feed -->
    <div class="feed-container">
        <div class="feed" id="feed"></div>
        <div style="text-align:center;padding:8px;">
            <button id="btn-load-more" style="display:none;background:#1f2937;color:#8b949e;border:1px solid #30363d;padding:6px 16px;border-radius:4px;cursor:pointer;">Load more</button>
        </div>
    </div>

    <!-- Bottom tabs -->
    <div class="tabs-container">
        <div class="tab-bar">
            <button class="active" data-tab="facts">Facts</button>
            <button data-tab="opinions">Opinions</button>
            <button data-tab="curiosity">Curiosity</button>
            <button data-tab="goals">Goals</button>
            <button data-tab="episodes">Episodes</button>
            <button data-tab="relationship">Relationship</button>
        </div>
        <div class="tab-companion-toggle" id="tab-companion-toggle">
            <!-- Participant pills for bottom tabs — populated dynamically -->
        </div>
        <div class="tab-content active" id="tab-facts">
            <div class="empty-state">No facts yet</div>
        </div>
        <div class="tab-content" id="tab-opinions">
            <div class="empty-state">No opinions yet</div>
        </div>
        <div class="tab-content" id="tab-curiosity">
            <div class="empty-state">No curiosity threads yet</div>
        </div>
        <div class="tab-content" id="tab-goals">
            <div class="empty-state">No goals yet</div>
        </div>
        <div class="tab-content" id="tab-episodes">
            <div class="empty-state">No episodes yet</div>
        </div>
        <div class="tab-content" id="tab-relationship">
            <div class="empty-state">No relationship data yet</div>
        </div>
    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.4/socket.io.min.js"></script>
<script src="/observe.js"></script>
</body>
</html>
